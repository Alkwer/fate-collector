name: Verify local native recognition report
on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful Deploy staging run for this exact main commit
        required: true
        type: string
      report_gzip_base64:
        description: Sanitized report from verify-recognition-release.mjs --github-input; original captures stay private
        required: true
        type: string
      native_execution_attested:
        description: I independently labeled fresh native F9 scenes and ran the local holdout on this staging package
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check staging identity and local execution attestation
        uses: actions/github-script@v9
        env:
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          ATTESTED: ${{ inputs.native_execution_attested }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main' || process.env.ATTESTED !== 'true' || !/^[1-9][0-9]*$/.test(process.env.STAGING_RUN_ID)) throw new Error('Main, staging run and explicit native execution attestation required.');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(process.env.STAGING_RUN_ID) });
            if (run.path !== '.github/workflows/deploy.yml' || run.event !== 'workflow_dispatch' || run.status !== 'completed' || run.conclusion !== 'success' || run.head_sha !== context.sha || run.head_branch !== 'main' || run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) throw new Error('Staging identity mismatch.');
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: collector-release
          path: .release
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
      - run: npm run release:verify
      - name: Verify submitted measurement and sanitize artifact
        env:
          REPORT_GZIP_BASE64: ${{ inputs.report_gzip_base64 }}
        run: |
          node --input-type=module -e "import {writeFileSync} from 'node:fs'; import {gunzipSync} from 'node:zlib'; writeFileSync('submitted-report.json', gunzipSync(Buffer.from(process.env.REPORT_GZIP_BASE64, 'base64'), {maxOutputLength: 2000000}))"
          mkdir recognition-report
          node scripts/verify-recognition-release.mjs submitted-report.json > recognition-report/report.json
          echo 'Verified local native measurement against staging identity and coverage policy. This workflow does not replay private captures.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: recognition-holdout
          path: recognition-report/report.json
          if-no-files-found: error
          retention-days: 30
