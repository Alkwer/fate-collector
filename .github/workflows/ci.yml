name: Validate collector
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  vision-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: prototypes/vision/requirements.txt
      - run: python -m pip install -r prototypes/vision/requirements.txt
      - run: python scripts/generate-visual-templates.py --check
      - run: python -m unittest discover -s prototypes/vision -p 'test_*.py' -v
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run release:pack
      - uses: actions/upload-artifact@v7
        with:
          name: collector-release
          path: .release/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures
          path: test-results/
  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate PowerShell bundle generation
        shell: powershell
        run: ./helpers/tests/Test-FateCapture.ps1
      - name: Validate capture conversion and OCR selection
        shell: powershell
        run: |
          ./helpers/tests/Test-CaptureImage.ps1
          ./helpers/tests/Test-OcrPasses.ps1
      - name: Validate persistent upload queue
        shell: powershell
        run: ./helpers/tests/Test-CloudUpload.ps1
      - name: Validate diagnostic privacy and consent
        shell: powershell
        run: ./helpers/tests/Test-Diagnostics.ps1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Set up AutoHotkey v2
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'AutoHotkey_2.0.31.zip'
          $install = Join-Path $env:RUNNER_TEMP 'AutoHotkey_2.0.31'
          Invoke-WebRequest 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.31/AutoHotkey_2.0.31.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'CA1A595ACA4528755D8D4CD7FED23D497A37BD9A0B6892072612D68DEE1BD00A') {
            throw 'Unexpected AutoHotkey release checksum.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $install
          "AUTOHOTKEY_EXE=$(Join-Path $install 'AutoHotkey64.exe')" >> $env:GITHUB_ENV
      - run: npm run test:calibration
      - run: npm run build
      - run: npm run test:upload:integration
      - name: Install compatibility browsers
        run: npx playwright install firefox msedge
      - name: Validate Edge and Firefox local review
        run: npx playwright test --config playwright.compat.config.ts
