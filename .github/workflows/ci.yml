name: Validate collector
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - run: npm run release:pack
      - uses: actions/upload-artifact@v4
        with:
          name: collector-release
          path: .release/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell bundle generation
        shell: powershell
        run: ./helpers/tests/Test-FateCapture.ps1
      - name: Validate persistent upload queue
        shell: powershell
        run: ./helpers/tests/Test-CloudUpload.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:upload:integration
