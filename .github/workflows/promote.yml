name: Promote tested release
on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful staging run for this main commit, or pinned run 44298821576 for hotfix-20261116
        required: true
        type: string
      validation_mode:
        description: Full native validation, expired prelaunch mode, or the pinned Fate advisor 0.10.0 exception
        required: true
        default: native-holdout
        type: choice
        options:
          - native-holdout
          - prelaunch
          - hotfix-20261116
      hotfix_update_acknowledged:
        description: For the pinned 0.10.0 release only, I accept deferred in-game, manual staging and real-widget checks
        required: true
        default: false
        type: boolean
      prelaunch_acknowledged:
        description: I accept deferred native Fate and manual staging validation; CI and live synthetic staging checks remain required
        required: true
        default: false
        type: boolean
      manual_tests_passed:
        description: For native-holdout only, I checked F9, OCR, offline recovery and local review on this staging release
        required: true
        default: false
        type: boolean
      recognition_run_id:
        description: Required for native-holdout; successful recognition report run for this exact release. Leave empty for exception modes
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: collector-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_VALIDATION_MODE: ${{ inputs.validation_mode }}
      HOTFIX_UPDATE_ACKNOWLEDGED: ${{ inputs.hotfix_update_acknowledged }}
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Require tested main commit
        uses: actions/github-script@v9
        env:
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          RELEASE_VALIDATION_MODE: ${{ inputs.validation_mode }}
          PRELAUNCH_ACKNOWLEDGED: ${{ inputs.prelaunch_acknowledged }}
          MANUAL_TESTS_PASSED: ${{ inputs.manual_tests_passed }}
          RECOGNITION_RUN_ID: ${{ inputs.recognition_run_id }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') throw new Error('Promotion requires main.');
            const { assertPromotionPolicy, PRELAUNCH_DEADLINE, HOTFIX_UPDATE_RELEASE } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/promotion-policy.mjs`);
            const mode = assertPromotionPolicy(process.env);
            if (!/^[1-9][0-9]*$/.test(process.env.STAGING_RUN_ID)) throw new Error('Invalid staging run ID.');
            if (mode === 'hotfix-20261116' && process.env.STAGING_RUN_ID !== HOTFIX_UPDATE_RELEASE.stagingRunId) throw new Error('Choose the pinned Fate hotfix staging run.');
            const sourceRevision = mode === 'hotfix-20261116' ? HOTFIX_UPDATE_RELEASE.revision : context.sha;
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(process.env.STAGING_RUN_ID) });
            if (run.path !== '.github/workflows/deploy.yml' || run.event !== 'workflow_dispatch' ||
                run.status !== 'completed' || run.conclusion !== 'success' || run.head_sha !== sourceRevision ||
                run.head_branch !== 'main' || run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Choose a successful staging workflow for this exact main commit.');
            }
            if (mode === 'hotfix-20261116') {
              await core.summary.addHeading('Pinned Fate advisor 0.10.0 release')
                .addRaw(`For this release, in-game validation is deferred, not passed. The owner also deferred the full manual staging checklist and real Turnstile interaction. Production Turnstile verification remains enabled. Only source ${HOTFIX_UPDATE_RELEASE.revision}, package ${HOTFIX_UPDATE_RELEASE.releaseId}, staging run ${HOTFIX_UPDATE_RELEASE.stagingRunId} is eligible. Full CI and live synthetic staging checks passed. The following steps recheck the package and staging deployment.\n`)
                .write();
              return;
            }
            if (mode === 'prelaunch') {
              await core.summary.addHeading('Prelaunch release exception')
                .addRaw(`Native Fate holdout and full manual staging validation are deferred, not passed. Exception expires ${PRELAUNCH_DEADLINE}. Complete native validation after launch before the next promotion. Full CI and live synthetic staging checks passed for this exact commit.\n`)
                .write();
              return;
            }
            const { data: recognition } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(process.env.RECOGNITION_RUN_ID) });
            if (recognition.path !== '.github/workflows/recognition-validation.yml' || recognition.event !== 'workflow_dispatch' ||
                recognition.status !== 'completed' || recognition.conclusion !== 'success' || recognition.head_sha !== context.sha ||
                recognition.head_branch !== 'main' || recognition.repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Choose the designated successful recognition workflow in this repository for this exact main commit.');
            }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: collector-release
          path: .release
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
      - run: npm run release:verify
      - uses: actions/download-artifact@v8
        if: inputs.validation_mode == 'native-holdout'
        with:
          name: recognition-holdout
          path: .recognition
          run-id: ${{ inputs.recognition_run_id }}
          github-token: ${{ github.token }}
      - name: Recompute the native holdout gate for this package
        if: inputs.validation_mode == 'native-holdout'
        run: node scripts/verify-recognition-release.mjs .recognition/report.json
      - name: Recheck the live staging release
        id: release
        run: |
          export EXPECTED_RELEASE_ID=$(node -p "JSON.parse(require('fs').readFileSync('.release/release.json')).releaseId")
          export EXPECTED_REVISION=$(node -p "JSON.parse(require('fs').readFileSync('.release/release.json')).revision")
          npm run test:staging
          echo "id=$EXPECTED_RELEASE_ID" >> "$GITHUB_OUTPUT"
        env:
          STAGING_READ_ONLY: 'true'
          STAGING_URL: https://app-staging.fate-collector.workers.dev
  production:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.fate-collector.workers.dev
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: collector-release
          path: .release
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
      - name: Promote the verified package
        run: npm run deploy -- production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_VERIFIED_RELEASE: ${{ needs.verify.outputs.release_id }}
          RELEASE_VALIDATION_MODE: ${{ inputs.validation_mode }}
          HOTFIX_UPDATE_ACKNOWLEDGED: ${{ inputs.hotfix_update_acknowledged }}
          PRELAUNCH_ACKNOWLEDGED: ${{ inputs.prelaunch_acknowledged }}
          MANUAL_TESTS_PASSED: ${{ inputs.manual_tests_passed }}
          RECOGNITION_RUN_ID: ${{ inputs.recognition_run_id }}
