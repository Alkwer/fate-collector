name: Promote tested release
on:
  workflow_dispatch:
    inputs:
      staging_run_id:
        description: Successful Deploy staging run ID for this main commit
        required: true
        type: string
      manual_tests_passed:
        description: I checked F9, OCR, offline recovery and local review on this staging release
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: collector-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Require tested main commit
        uses: actions/github-script@v7
        env:
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          MANUAL_TESTS_PASSED: ${{ inputs.manual_tests_passed }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main' || process.env.MANUAL_TESTS_PASSED !== 'true') {
              throw new Error('Promotion requires main and explicit confirmation of manual staging tests.');
            }
            if (!/^[1-9][0-9]*$/.test(process.env.STAGING_RUN_ID)) throw new Error('Invalid staging run ID.');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(process.env.STAGING_RUN_ID) });
            if (run.path !== '.github/workflows/deploy.yml' || run.event !== 'workflow_dispatch' ||
                run.status !== 'completed' || run.conclusion !== 'success' || run.head_sha !== context.sha ||
                run.head_branch !== 'main' || run.repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              throw new Error('Choose a successful staging workflow for this exact main commit.');
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: collector-release
          path: .release
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
      - run: npm run release:verify
      - name: Recheck the live staging release
        id: release
        run: |
          export EXPECTED_RELEASE_ID=$(node -p "JSON.parse(require('fs').readFileSync('.release/release.json')).releaseId")
          npm run test:staging
          echo "id=$EXPECTED_RELEASE_ID" >> "$GITHUB_OUTPUT"
        env:
          STAGING_READ_ONLY: 'true'
          STAGING_URL: https://app-staging.fate-collector.workers.dev
          EXPECTED_REVISION: ${{ github.sha }}
  production:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.fate-collector.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: collector-release
          path: .release
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}
      - name: Promote the verified package
        run: npm run deploy -- production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_VERIFIED_RELEASE: ${{ needs.verify.outputs.release_id }}
